name: Compilar instalador Windows

on:
  pull_request:
    paths: ["installer/**", ".github/workflows/installer.yml"]
  push:
    branches: [main]
    paths: ["installer/**", ".github/workflows/installer.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test .\installer\Dota2Translate.Tests\Dota2Translate.Tests.csproj -c Release
      - run: dotnet publish .\installer\Dota2Translate.Installer\Dota2Translate.Installer.csproj -c Release -r win-x64 --self-contained true
      - uses: actions/upload-artifact@v4
        with:
          name: Dota2TranslatePTBR-win-x64
          path: installer/Dota2Translate.Installer/bin/Release/net8.0-windows/win-x64/publish/
