name: Corrigir catálogo
description: Relatar uma linha, herói, persona ou narrador ausente ou incorreto
title: "[CATÁLOGO] "
labels: ["herói"]
body:
  - type: input
    id: source
    attributes:
      label: Herói, persona ou narrador
    validations:
      required: true
  - type: input
    id: line
    attributes:
      label: ID da linha
      description: Deixe vazio quando o problema afetar a fonte inteira.
  - type: textarea
    id: problem
    attributes:
      label: O que precisa ser corrigido?
      description: Para uma nova tradução ou pack de voz, use o próprio portal.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build do Dota 2
